{% extends "metronic/base_auth.html" %}
{% block page_title %}Correo Enviado{% endblock %}

{% block auth_content %}
  <div class="text-center">
    <h1 class="text-dark fw-bolder mb-3">Revisa tu correo</h1>
    <div class="alert alert-success">
      Si el email existe en el sistema, enviamos un enlace para restablecer la contraseña.
    </div>
    <a href="{% url 'login' %}" class="btn btn-primary">Volver al login</a>
  </div>
{% endblock %}
